name: CI

on:
  push:
    branches: [main, nextjs-v2]
  pull_request:
    branches: [main, nextjs-v2]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs `prisma generate`; it reads the schema only (no DB).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # DB-free specs: bot/**/*.spec.ts (DDD domain) + lib/**/*.spec.ts (pure
      # helpers shared with the app). The test/**/*.test.ts suite is
      # integration-level (needs a seeded Postgres) — see the commented job
      # below to enable it once seeding is scripted in CI.
      - name: Unit tests (domain)
        run: npx vitest run bot/ lib/

  # ── Integration tests (opt-in) ────────────────────────────────────────────
  # Requires a Postgres service + `prisma migrate deploy` + KPI-rule seeding. Uncomment
  # and wire a seed step once the seed scripts are made CI-idempotent.
