# ─────────────────────────────────────────────────────────────────────────────
# ASRO — full local/production-like stack: Postgres + Redis + web + bot worker.
# Secrets come from a .env file (copy .env.example → .env). Scaffolding: verify
# `docker compose build` before relying on it.
#
#   docker compose up -d db redis      # infra only
#   docker compose run --rm web npx prisma db push   # apply schema (first run)
#   docker compose up -d --build       # full stack
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asro}
      POSTGRES_DB: ${POSTGRES_DB:-asro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: prod serverda Postgres hech qachon tashqi interfeysga
      # ochilmasin (default parol bilan internetga ochiq DB — klassik hodisa).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      # Loopback-only — parolsiz Redis tashqariga ochilmasin.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # `.env` must be COMPLETE for a Compose bring-up (AUTH_SECRET, AUTH_URL,
    # NEXTAUTH_URL, CREDENTIALS_SECRET, TELEGRAM_* …) — the image excludes
    # `.env.local` (see .dockerignore), so only these env_files reach the
    # container. `.env.local` is picked up as an optional dev fallback.
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://asro:asro@db:5432/asro?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Cron soatlari (billing 09:00) va davomat chegaralari lokal vaqtga
      # bog'liq — konteyner UTC'da qolsa hammasi 5 soatga suriladi.
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "bot:start"]
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://asro:asro@db:5432/asro?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TZ: ${TZ:-Asia/Tashkent}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
